[package]
name = "appcore"
version = "2.0.4"
edition = "2024"

[lib]
name = "appcore"
path = "src/lib.rs"

[dependencies]
database = { path = "../database" }
cleaner = { path = "../cleaner" }
script-api = { path = "../script-api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
notify-rust = "4"
tempfile = "3.27"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Un-gzips the embedded sounds. Regular dependency, not just a build one: the
# compressed bytes are stored in the binary and decompressed per playback.
flate2 = "1.1"

# Audio output. Android has no rodio support here and gets silent no-ops.
[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = "0.23"

# Gzips the sounds in `assets/` into `OUT_DIR` (see `build.rs`).
[build-dependencies]
flate2 = "1.1"