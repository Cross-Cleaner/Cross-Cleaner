[package]
name = "desktop"
version = "2.0.4"
edition = "2024"

[features]
default = ["self-update"]
# The whole update path: checking GitHub for a newer release, announcing it with
# a notification, and replacing the running executable with the download. Turn it
# off with `--no-default-features` for a distribution package — the repository
# owns the version, so the app must neither advertise a newer release nor rewrite
# a file the package manager installed.
self-update = ["dep:selfupdate"]

[dependencies]
gui = { path = "../gui" }
appcore = { path = "../appcore" }
database = { path = "../database" }
cleaner = { path = "../cleaner" }
egui = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
notify-rust = "4"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
# No `rodio`: sounds are initialised through `gui::sounds`, which re-exports the
# shared player in `appcore`.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
# Owns the executable replacement: the GUI only renders the shared update state.
# Optional, so a build without the `self-update` feature never compiles it.
selfupdate = { path = "../selfupdate", optional = true }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "glow",
    "default_fonts",
] }
winreg = "0.56.0"
raw-window-handle = "0.6"
# ShellExecuteW for the UAC prompt on restart (see `src/updater.rs`).
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "glow",
    "default_fonts",
] }

# Icon, version block and the administrator requirement, shared with `tui`.
# Unconditional: `winicon` compiles to a no-op off Windows, which keeps
# `build.rs` free of `cfg`.
[build-dependencies]
winicon = { path = "../winicon" }

[package.metadata.winres]
FileDescription = "Cross Cleaner"
OriginalFilename = "Cross Cleaner.exe"
LegalCopyright = "Copyright Monolith Development © 2026"
ProductName = "Cross Cleaner"
