[package]
name = "script-api"
version = "2.0.4"
edition = "2024"

[dependencies]
database = { path = "../database" }
# For `skip_if_running` and `cleaner::running`: a script must agree with the
# engine on what "the browser is open" means, and there is exactly one answer.
cleaner = { path = "../cleaner" }
glob = "0.3.4"
rune = "0.14.2"
# The standard Rune modules scripts are written against: `std::fs` for reading,
# `json` for building webhook payloads, `rand` for jitter, `time` for deadlines,
# `process` for programs that only answer to their own command line.
serde_json = "1.0"
rune-modules = { version = "0.14.2", default-features = false, features = [
    "fs",
    "json",
    "rand",
    "time",
    "process",
] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
# The same client the update check uses, so no second TLS stack is pulled in
# only for the finished-run webhook.
ureq = { version = "3.4", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }