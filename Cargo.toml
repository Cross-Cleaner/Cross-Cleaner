[workspace]
resolver = "3"
members = [
    "crates/android",
    "crates/appcore",
    "crates/cleaner",
    "crates/cli",
    "crates/database",
    "crates/desktop",
    "crates/gui",
    "crates/script-api",
    "crates/selfupdate",
    "crates/tui",
    # Pulled in as a build dependency by both binaries, so it is compiled anyway.
    # Listed explicitly because it owns the icon and the tests that guard it —
    # as an excluded path dependency those tests would never run.
    "crates/winicon",
]

# gpu-allocator needs no patch anymore: the crates.io 0.28.0 release ships the
# widened `windows` requirement ("0.53-0.62", upstream PR #288) that wgpu-hal
# 30.0.1 wants, so resolution succeeds straight from the registry and the whole
# graph settles on windows 0.62. If upstream ever regresses that range, a
# [patch.crates-io] entry can come back here.

# Every published binary is a portable file a user downloads and runs in place,
# so size wins over speed: `opt-level = "z"` gives up a little throughput for a
# noticeably smaller executable, and nothing this app does is bound tightly
# enough for that to show. Everything that would otherwise pad the file is off:
# no debug info, no symbols, no unwinder, no incremental state, no rpath.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
debug = false
incremental = false
rpath = false

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true
